# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Postgres is not defined here: the migrations create a BYPASSRLS role, which Render Postgres's
# non-superuser owner cannot do. Use Neon (its owner role may), and paste the owner's connection
# string into RADREPORT_OWNER_DATABASE_URL when Render prompts for it.
#
# Free tier: one web instance runs everything (`radreport-start all`: migrate, API, job worker, relay),
# since Render's free plan has no background workers or pre-deploy step. It sleeps after 15 idle
# minutes. To scale up, put web on a paid plan with `preDeployCommand: radreport-start migrate` and
# `dockerCommand: radreport-start web`, and add a worker service running `radreport-start jobs`.

envVarGroups:
  - name: radreport-config
    envVars:
      - key: RADREPORT_ENVIRONMENT
        value: production
      # One uvicorn worker + the job worker + the relay share a 512 MB free instance.
      - key: RADREPORT_DB__POOL_SIZE
        value: "3"
      - key: RADREPORT_DB__MAX_OVERFLOW
        value: "2"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: WORKER_CONCURRENCY
        value: "1"
      # Speech recognition on Deepgram (Nova-3 Medical); the key is DEEPGRAM_API_KEY below.
      - key: RADREPORT_ASR__ENGINE
        value: deepgram
      # Generated once on the first sync; shared by every service.
      - key: RADREPORT_APP_DB_PASSWORD
        generateValue: true
      - key: RADREPORT_LAB_AUTH__TOKEN_SECRET
        generateValue: true
      - key: RADREPORT_OBSERVABILITY__METRICS_TOKEN
        generateValue: true

services:
  - type: web
    name: radreport-web
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /ready
    dockerCommand: radreport-start all
    envVars:
      - fromGroup: radreport-config
      - key: RADREPORT_REDIS_URL
        fromService:
          type: keyvalue
          name: radreport-cache
          property: connectionString
      # Prompted for on the first Blueprint sync.
      - key: RADREPORT_OWNER_DATABASE_URL
        sync: false
      # Optional: a Neon read replica's host (no scheme, user or path); dashboards, lists and exports read from it while it is caught up.
      - key: RADREPORT_REPLICA_HOST
        sync: false
      - key: RADREPORT_STORAGE__BUCKET
        sync: false
      - key: RADREPORT_STORAGE__REGION
        sync: false
      - key: RADREPORT_STORAGE__ACCESS_KEY_ID
        sync: false
      - key: RADREPORT_STORAGE__SECRET_ACCESS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      # Gemini (OpenAI-compatible endpoint); the admin panel's gemini provider names this variable.
      - key: GEMINI_API_KEY
        sync: false
      # Password of the first product admin (admin@radreport.local), set when the API seeds an empty database on its first start.
      - key: RADREPORT_SEED_ADMIN_PASSWORD
        sync: false
      # The read-only logins on the login pages' Test credentials tab, as JSON; `radreport-start seed`
      # creates them (radreport-start python -m radreport.devtools.seed). Paste the value from
      # .env.render (gitignored); never commit it here.
      - key: RADREPORT_DEMO_ACCOUNTS
        sync: false

  # Shared cache for lab config, roles, model assignments and admin sessions; reachable only from these services.
  - type: keyvalue
    name: radreport-cache
    region: singapore
    plan: free
    ipAllowList: []
